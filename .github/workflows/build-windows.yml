name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (for example v1.2.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate new release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw 'Use a tag containing letters, digits, dots, underscores or hyphens.'
          }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Git tag' }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags' }
          if ($existing) { throw 'This tag already exists. Choose a new release tag.' }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements_qt.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements_qt.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test document model and HDL generation
        run: python -m unittest discover -s tests -q

      - name: Test qt_preview_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_preview_smoke.py

      - name: Test qt_grid_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_grid_smoke.py

      - name: Test qt_editor_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_editor_smoke.py

      - name: Test qt_segments_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_segments_smoke.py

      - name: Test qt_junction_markers_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_junction_markers_smoke.py

      - name: Test qt_consumed_tips_smoke.py
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: python tests/qt_consumed_tips_smoke.py

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --exclude-module tkinter --name VerilogCanvasQt qt_editor.py

      - name: Record build information
        run: |
          if (-not (Test-Path 'dist/VerilogCanvasQt.exe')) { throw 'Executable not found' }
          $hash = (Get-FileHash 'dist/VerilogCanvasQt.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  VerilogCanvasQt.exe" | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Platform: Windows x64"
            "Python: $(python --version)"
            ""
            "Installed build dependencies:"
          ) | Set-Content -Encoding utf8 dist/BUILD_INFO.txt
          python -m pip freeze | Add-Content -Encoding utf8 dist/BUILD_INFO.txt

      - name: Archive exact release sources
        run: |
          git archive --format=zip --prefix=VerilogCanvas/ --output=dist/VerilogCanvas-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash 'dist/VerilogCanvas-source.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  VerilogCanvas-source.zip" | Add-Content -Encoding utf8 dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          @(
            "Windows x64 standalone build."
            ""
            "Download VerilogCanvasQt.exe to run the application (Python/Qt installation is not required)."
            "Download VerilogCanvas-source.zip for the matching source code."
            ""
            "Commit: $env:GITHUB_SHA"
            "Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 release-notes.md
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "VerilogCanvas $env:RELEASE_TAG" --notes-file release-notes.md --draft dist/VerilogCanvasQt.exe dist/VerilogCanvas-source.zip dist/SHA256SUMS.txt dist/BUILD_INFO.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed; inspect the draft before retrying.' }
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Assets uploaded, but publication failed; inspect the draft release.' }
          "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
