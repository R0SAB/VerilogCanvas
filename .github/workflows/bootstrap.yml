name: Import archive contents

on:
  push:
    paths:
      - '.bootstrap/part08b'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and extract archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03
            cat .bootstrap/part04a .bootstrap/part04b
            cat .bootstrap/part05 .bootstrap/part06 .bootstrap/part07
            cat .bootstrap/part08a .bootstrap/part08b
            cat .bootstrap/part09
          } | base64 -d > /tmp/source.zip
          unzip -t /tmp/source.zip
          mkdir -p /tmp/unpack
          unzip -q /tmp/source.zip -d /tmp/unpack
          cp -a /tmp/unpack/VerilogCanvas_Qt/. .
      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import VerilogCanvas from provided archive'
          git push
